
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aashish Upreti | Shinobi Path</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 15 C 25 15, 10 35, 10 55 C 10 80, 35 95, 60 85 C 80 75, 85 50, 75 35 C 65 20, 45 25, 40 40 C 35 55, 55 65, 65 55' fill='none' stroke='%23ff9a00' stroke-width='8' stroke-linecap='round'/%3E%3Cpath d='M85 35 L 95 25 L 75 25 Z' fill='%23ff9a00'/%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --naruto-orange: #ff9a00;
      --naruto-blue: #1a237e;
      --leaf-green: #2e7d32;
    }
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #050505;
      color: #f8fafc;
      overflow-x: hidden;
    }
    h1, h2, h3, .font-heading {
      font-family: 'Space+Grotesk', sans-serif;
    }
    .glass {
      background: rgba(15, 15, 20, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 154, 0, 0.2);
    }
    .naruto-gradient {
      background: linear-gradient(135deg, #ff9a00 0%, #ff4500 100%);
    }
    .text-naruto-gradient {
      background: linear-gradient(135deg, #ff9a00 0%, #ff4500 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .scroll-bg {
      background: #fdf5e6;
      color: #2b1d0e;
      border: 2px solid #8b4513;
    }
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #050505;
    }
    ::-webkit-scrollbar-thumb {
      background: #ff9a00;
      border-radius: 10px;
    }
    
    /* Animations */
    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(2deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    .float { animation: float 4s ease-in-out infinite; }

    @keyframes sharingan-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-sharingan {
      animation: sharingan-spin 12s linear infinite;
    }

    @keyframes sharingan-pulse {
      0%, 100% { transform: scale(1); opacity: 0.15; }
      50% { transform: scale(1.1); opacity: 0.25; }
    }
    .animate-sharingan-container {
      animation: sharingan-pulse 4s ease-in-out infinite;
    }

    @keyframes ninja-fly {
      0% { 
        transform: translate(-100px, -100px) rotate(0deg); 
        opacity: 0; 
      }
      10% { opacity: 0.3; }
      90% { opacity: 0.3; }
      100% { 
        transform: translate(110vw, 110vh) rotate(1080deg); 
        opacity: 0; 
      }
    }
    .ninja-weapon {
      position: fixed;
      pointer-events: none;
      z-index: 10;
      animation: ninja-fly var(--duration) linear infinite;
      color: rgba(255, 255, 255, 0.1);
    }
    
    .leaf-swirl {
      width: 40px;
      height: 40px;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50 10 C 20 10, 10 40, 10 50 C 10 70, 30 90, 50 90 C 70 90, 90 70, 90 50 C 90 30, 70 10, 50 10 M 50 30 C 65 30, 75 45, 65 60 C 55 75, 40 70, 40 55 C 40 45, 50 40, 55 45" fill="none" stroke="%23ff9a00" stroke-width="5"/></svg>');
      background-size: contain;
    }

    /* Straw Hat Specific Styles */
    .straw-hat-pop {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%) scale(0.8);
      width: 80px;
      height: 40px;
      background: #f4d03f;
      border-radius: 50% 50% 0 0;
      border: 3px solid #3e2723;
      z-index: 40;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      opacity: 0;
    }
    .straw-hat-pop::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: -20px;
      width: 120px;
      height: 12px;
      background: #f4d03f;
      border-radius: 50%;
      border: 3px solid #3e2723;
    }
    .straw-hat-pop::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: -5px;
      width: 90px;
      height: 6px;
      background: #c0392b;
      z-index: 1;
    }
    .group:hover .straw-hat-pop {
      opacity: 1;
      transform: translateX(-50%) translateY(-20px) scale(1.1) rotate(-5deg);
    }

    .wanted-text {
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: -0.05em;
      text-transform: uppercase;
      font-weight: 900;
    }
  </style>
